name: Security Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: 3.10
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run Bandit security scan
      run: |
        bandit -r . -f json -o bandit-report.json
        bandit -r . -f txt -o bandit-report.txt
    
    - name: Run Safety check
      run: |
        safety check --json --output safety-report.json
        safety check --full-report --output safety-report.txt
    
    - name: Run Semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
        output-format: json
        output-file: semgrep-report.json
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          bandit-report.txt
          safety-report.json
          safety-report.txt
          semgrep-report.json
    
    - name: Comment PR with security findings
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          // Read security reports
          let banditFindings = [];
          let safetyFindings = [];
          let semgrepFindings = [];
          
          try {
            if (fs.existsSync('bandit-report.json')) {
              const banditData = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
              banditFindings = banditData.results || [];
            }
          } catch (e) {
            console.log('Could not read bandit report:', e.message);
          }
          
          try {
            if (fs.existsSync('safety-report.json')) {
              const safetyData = JSON.parse(fs.readFileSync('safety-report.json', 'utf8'));
              safetyFindings = safetyData.vulnerabilities || [];
            }
          } catch (e) {
            console.log('Could not read safety report:', e.message);
          }
          
          try {
            if (fs.existsSync('semgrep-report.json')) {
              const semgrepData = JSON.parse(fs.readFileSync('semgrep-report.json', 'utf8'));
              semgrepFindings = semgrepData.results || [];
            }
          } catch (e) {
            console.log('Could not read semgrep report:', e.message);
          }
          
          // Create comment
          let comment = '## 🔒 Security Analysis Results\n\n';
          
          if (banditFindings.length > 0) {
            comment += `### Bandit Findings: ${banditFindings.length} issues\n`;
            banditFindings.slice(0, 5).forEach(finding => {
              comment += `- **${finding.issue_severity}**: ${finding.issue_text} (${finding.filename}:${finding.line_number})\n`;
            });
            if (banditFindings.length > 5) {
              comment += `- ... and ${banditFindings.length - 5} more issues\n`;
            }
            comment += '\n';
          }
          
          if (safetyFindings.length > 0) {
            comment += `### Safety Findings: ${safetyFindings.length} vulnerabilities\n`;
            safetyFindings.slice(0, 5).forEach(finding => {
              comment += `- **${finding.severity}**: ${finding.package} ${finding.installed_version} (${finding.vulnerability_id})\n`;
            });
            if (safetyFindings.length > 5) {
              comment += `- ... and ${safetyFindings.length - 5} more vulnerabilities\n`;
            }
            comment += '\n';
          }
          
          if (semgrepFindings.length > 0) {
            comment += `### Semgrep Findings: ${semgrepFindings.length} issues\n`;
            semgrepFindings.slice(0, 5).forEach(finding => {
              comment += `- **${finding.extra.severity}**: ${finding.extra.message} (${finding.path}:${finding.start.line})\n`;
            });
            if (semgrepFindings.length > 5) {
              comment += `- ... and ${semgrepFindings.length - 5} more issues\n`;
            }
            comment += '\n';
          }
          
          if (banditFindings.length === 0 && safetyFindings.length === 0 && semgrepFindings.length === 0) {
            comment += '✅ No security issues found!\n';
          } else {
            comment += '⚠️ Please review the security findings above.\n';
          }
          
          comment += '\n📊 Full reports are available in the workflow artifacts.';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  dependency-review:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Dependency Review
      uses: actions/dependency-review-action@v3
      with:
        fail-on-severity: moderate