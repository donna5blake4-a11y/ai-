[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-deals-manager"
version = "1.0.0"
description = "نظام إدارة العروض الذكي مع دعم AI"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AI Deals Team", email = "support@aideals.com"}
]
maintainers = [
    {name = "AI Deals Team", email = "support@aideals.com"}
]
keywords = [
    "amazon", "deals", "ai", "telegram", "bot", "price", "comparison",
    "egypt", "jumia", "noon", "scraping", "database", "sqlite"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "aiohttp>=3.8.0",
    "asyncio>=3.4.3",
    "dataclasses>=0.6",
    "typing-extensions>=4.0.0",
    "schedule>=1.2.0",
    "python-dateutil>=2.8.2",
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "ujson>=5.8.0",
    "aiofiles>=23.0.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.3.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "pdbpp>=0.10.3",
    "ipdb>=0.13.13",
    "memory-profiler>=0.61.0",
    "line-profiler>=4.1.0",
    "bandit>=1.7.5",
    "safety>=2.3.0",
    "types-requests>=2.31.0",
    "types-aiofiles>=23.0.0",
    "aioresponses>=0.7.0",
    "responses>=0.23.0",
    "freezegun>=1.2.0",
]
gui = [
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/your-repo/ai-deals-manager"
Documentation = "https://github.com/your-repo/ai-deals-manager/blob/main/README.md"
Repository = "https://github.com/your-repo/ai-deals-manager"
"Bug Tracker" = "https://github.com/your-repo/ai-deals-manager/issues"
"Source Code" = "https://github.com/your-repo/ai-deals-manager"

[project.scripts]
ai-deals = "ai_deals_manager:main"
ai-deals-test = "test_ai_system:main"
ai-deals-run = "run_ai_system:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.txt"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["ai_deals_manager"]
known_third_party = ["requests", "aiohttp", "asyncio"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "examples"]
skips = ["B101", "B601"]

[tool.safety]
output = "json"