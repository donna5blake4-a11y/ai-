[tox]
envlist = py38, py39, py310, py311, lint, type-check, security
isolated_build = True

[testenv]
deps =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-asyncio>=0.21.0
    pytest-mock>=3.11.0
    aioresponses>=0.7.0
    responses>=0.23.0
    freezegun>=1.2.0
commands =
    pytest {posargs:tests} --cov=. --cov-report=term-missing --cov-report=html
    coverage report --show-missing

[testenv:lint]
deps =
    black>=23.0.0
    flake8>=6.0.0
    isort>=5.12.0
    bandit>=1.7.5
commands =
    black --check --diff .
    flake8 .
    isort --check-only --diff .
    bandit -r . -f json -o bandit-report.json

[testenv:type-check]
deps =
    mypy>=1.0.0
    types-requests>=2.31.0
    types-aiofiles>=23.0.0
commands =
    mypy .

[testenv:security]
deps =
    safety>=2.3.0
commands =
    safety check --json --output safety-report.json

[testenv:format]
deps =
    black>=23.0.0
    isort>=5.12.0
commands =
    black .
    isort .

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = .git,__pycache__,build,dist,.tox,.venv,venv

[bandit]
exclude_dirs = tests,examples
skips = B101,B601